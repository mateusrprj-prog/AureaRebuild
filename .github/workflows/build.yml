name: Build unsigned IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum ZIP encontrado"
            exit 1
          fi
          echo "ZIP encontrado: $ZIP"
          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project
          echo "Conteúdo extraído:"
          find project -maxdepth 3 -type f | head -100

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: project
        run: |
          SPEC=$(find . -maxdepth 3 -type f \( -name 'project.yml' -o -name 'project.yaml' -o -name 'project' \) -print -quit)
          if [ -z "$SPEC" ]; then
            echo "ERRO: especificação do XcodeGen não encontrada"
            find . -maxdepth 3 -type f
            exit 1
          fi
          echo "Spec encontrada: $SPEC"
          xcodegen generate --spec "$SPEC"

      - name: Build unsigned archive
        working-directory: project
        run: |
          xcodebuild archive \
            -project AureaRebuild.xcodeproj \
            -scheme AureaRebuild \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/AureaRebuild.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA
        working-directory: project
        run: |
          rm -rf Payload AureaRebuild-unsigned.ipa
          mkdir Payload
          cp -R build/AureaRebuild.xcarchive/Products/Applications/AureaRebuild.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload AureaRebuild-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AureaRebuild-unsigned-ipa
          path: project/AureaRebuild-unsigned.ipa
          if-no-files-found: error
